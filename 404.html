<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'; form-action 'none'; base-uri 'self'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex">
  <title>404 — Page introuvable | Page not found — Yanni Delattre Balcer</title>
  <meta name="description" content="Page introuvable / Page not found">

  <link rel="icon" type="image/png" href="/assets/img/favicon.png">
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;700;900&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #060606;
      --text: #d9d9d9;
      --heading: #ffffff;
      --surface: #1c1c1c;
      --border: rgba(255, 255, 255, 0.12);
      --accent: #c0c0cc;
    }
    @media (prefers-color-scheme: light) {
      /* Le site est sombre : on garde le même rendu quel que soit le thème système */
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: radial-gradient(ellipse at 50% 0%, #1b1b1b 0%, var(--bg) 60%);
      color: var(--text);
      font-family: "Roboto", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
    }
    .box {
      width: 100%;
      max-width: 560px;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: clamp(28px, 6vw, 48px) clamp(20px, 5vw, 40px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    .code {
      font-family: "Mulish", sans-serif;
      font-weight: 900;
      font-size: clamp(64px, 20vw, 120px);
      line-height: 1;
      letter-spacing: 0.04em;
      color: var(--heading);
      margin: 0 0 8px;
    }
    h1 {
      font-family: "Mulish", sans-serif;
      font-size: clamp(1.25rem, 4.5vw, 1.6rem);
      color: var(--heading);
      margin: 0 0 8px;
    }
    p { margin: 0 0 24px; line-height: 1.6; }
    .en { color: #9a9aa6; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .btn {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 10px;
      border: 1px solid var(--border);
      color: var(--heading);
      text-decoration: none;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.06);
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
    }
    .btn:hover, .btn:focus-visible {
      background: rgba(255, 255, 255, 0.14);
      border-color: var(--accent);
      transform: translateY(-2px);
      outline: none;
    }
  </style>
</head>

<body>
  <main class="box">
    <div class="code" aria-hidden="true">404</div>
    <h1>Page introuvable</h1>
    <p>La page que vous cherchez n'existe pas ou a été déplacée.</p>
    <h1 class="en" lang="en">Page not found</h1>
    <p class="en" lang="en">The page you are looking for does not exist or has been moved.</p>
    <div class="actions">
      <a class="btn" href="/">Retour à l'accueil</a>
      <a class="btn" href="/index_en.html" lang="en">Back to home</a>
    </div>
  </main>
</body>

</html>
